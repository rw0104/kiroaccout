name: Windows x64 build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    defaults:
      run:
        working-directory: Kiro-account-manager
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: Kiro-account-manager/package-lock.json
      - name: Validate version and release notes
        id: version
        run: node scripts/release-version.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Offline regressions
        run: npm run test:unit
      - name: Typecheck and compile
        run: npm run build
      - name: Package without installing or publishing
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged application contents
        run: npm run verify:package
      - name: Generate exact artifact checksums
        run: npm run release:checksums
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          if-no-files-found: error
          path: |
            Kiro-account-manager/dist/*-x64-setup.exe
            Kiro-account-manager/dist/*-x64-windows.zip
            Kiro-account-manager/dist/SHA256SUMS.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-release
          path: release-assets
      - name: Verify downloaded checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish complete release
        shell: bash
        run: |
          set -euo pipefail
          # --target only applies to a new tag. Reject any existing tag at another commit.
          remote_refs="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          if [[ -n "$remote_refs" ]]; then
            git fetch --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            if [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "Existing tag does not match the built commit"
              exit 1
            fi
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG"
            exit 1
          fi
          flags=(--latest=false)
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft "${flags[@]}" \
            --title "kiroaccout $RELEASE_VERSION · Windows x64" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            release-assets/*
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
